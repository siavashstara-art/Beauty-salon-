name: Beauty Studio - Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Install required Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Check Gradle
        run: ./gradlew --version

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Build Release AAB
        run: ./gradlew bundleRelease --stacktrace

      - name: Show generated APK files
        if: always()
        run: |
          echo "===== APK FILES ====="
          find . -type f -name "*.apk" -print || true

      - name: Show generated AAB files
        if: always()
        run: |
          echo "===== AAB FILES ====="
          find . -type f -name "*.aab" -print || true

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BeautyStudio-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error

      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BeautyStudio-Release-APK
          path: "**/build/outputs/apk/release/*.apk"
          if-no-files-found: error

      - name: Upload Release AAB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BeautyStudio-Release-AAB
          path: "**/build/outputs/bundle/release/*.aab"
          if-no-files-found: error
